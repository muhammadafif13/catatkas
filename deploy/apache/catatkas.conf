# CatatKas — Apache site config
# Ganti app.domain.com dengan domain Anda.
# Simpan sebagai /etc/apache2/sites-available/catatkas.conf
# Aktifkan modul: a2enmod rewrite headers
#
# File ini sengaja HTTP-only. Setelah situs aktif, jalankan:
#   sudo certbot --apache -d app.domain.com
# Certbot akan menambahkan VirtualHost 443, sertifikat, dan redirect HTTP → HTTPS.

<VirtualHost *:80>
    ServerName app.domain.com

    DocumentRoot /var/www/catatkas/current
    DirectoryIndex index.html

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    <Directory /var/www/catatkas/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA fallback untuk React Router.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Asset Vite punya hash di nama file, aman di-cache lama.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <LocationMatch "^/(index\.html|sw\.js)$">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/catatkas-error.log
    CustomLog ${APACHE_LOG_DIR}/catatkas-access.log combined
</VirtualHost>
