# CatatKas — Nginx site config
# Ganti app.domain.com dengan domain Anda.
# Simpan sebagai /etc/nginx/sites-available/catatkas.conf
#
# File ini sengaja HTTP-only. Setelah situs aktif, jalankan:
#   sudo certbot --nginx -d app.domain.com
# Certbot akan menambahkan listener 443, sertifikat, dan redirect HTTP → HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name app.domain.com;

    root /var/www/catatkas/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Halaman privacy statis untuk Play Store.
    location = /privacy {
        return 301 /privacy/;
    }

    location /privacy/ {
        try_files $uri $uri/ =404;
    }

    # Asset Vite punya hash di nama file, aman di-cache lama.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Jangan cache shell PWA dan service worker.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    # SPA fallback untuk React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/catatkas.access.log;
    error_log  /var/log/nginx/catatkas.error.log;
}
