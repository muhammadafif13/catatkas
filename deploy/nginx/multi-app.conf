# CatatKas — semua vhost dalam satu file
# Simpan sebagai /etc/nginx/sites-available/aniwall.conf
#
# File ini sengaja HTTP-only. Setelah situs aktif, jalankan:
#   sudo certbot --nginx -d catatkas.aniwall.my.id -d app.aniwall.my.id
# Certbot menambahkan listener 443, sertifikat, dan redirect HTTP -> HTTPS.

# ---------- 1. Halaman kebijakan privasi + hapus akun ----------
server {
    listen 80;
    listen [::]:80;
    server_name catatkas.aniwall.my.id;

    root /var/www/catatkas-privacy;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Halaman HTML: jangan di-cache agar perubahan langsung terlihat.
    location = /index.html {
        expires -1;
    }

    location = /delete-account.html {
        expires -1;
    }

    # URL yang didaftarkan di Play Console (tanpa ekstensi).
    location = /delete-account {
        try_files /delete-account.html =404;
    }

    # Verifikasi AdMob/AdSense wajib disajikan sebagai text/plain.
    location = /app-ads.txt {
        default_type text/plain;
        expires 1h;
        try_files $uri =404;
    }

    location = /ads.txt {
        default_type text/plain;
        expires 1h;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/catatkas-privacy.access.log;
    error_log  /var/log/nginx/catatkas-privacy.error.log;
}

# ---------- 2. Aplikasi CatatKas (SPA) ----------
server {
    listen 80;
    listen [::]:80;
    server_name app.aniwall.my.id;

    root /var/www/catatkas/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Asset Vite punya hash di nama file, aman di-cache lama.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Jangan cache shell PWA dan service worker.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback untuk React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/catatkas.access.log;
    error_log  /var/log/nginx/catatkas.error.log;
}
