# CatatKas — halaman kebijakan privasi statis
# Domain: catatkas.aniwall.my.id
# Simpan sebagai /etc/nginx/sites-available/catatkas-privacy.conf
#
# File ini sengaja HTTP-only. Setelah situs aktif, jalankan:
#   sudo certbot --nginx -d catatkas.aniwall.my.id
# Certbot menambahkan listener 443, sertifikat, dan redirect HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name catatkas.aniwall.my.id;

    root /var/www/catatkas-privacy;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Kebijakan privasi: jangan di-cache agar perubahan langsung terlihat.
    location = /index.html {
        expires -1;
    }

    # Verifikasi AdMob/AdSense wajib disajikan sebagai text/plain.
    location = /app-ads.txt {
        default_type text/plain;
        expires 1h;
        try_files $uri =404;
    }

    location = /ads.txt {
        default_type text/plain;
        expires 1h;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/catatkas-privacy.access.log;
    error_log  /var/log/nginx/catatkas-privacy.error.log;
}
