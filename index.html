<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="CatatKas — PWA offline-first untuk mencatat pemasukan dan pengeluaran harian. Semua data tersimpan aman di perangkatmu." />
    <meta name="application-name" content="CatatKas" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CatatKas" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>CatatKas — Catatan Keuangan Pribadi</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100dvh;
        min-height: 100svh;
      }

      .boot-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 28%, rgba(99, 102, 241, 0.22), transparent 42%),
          #0f172a;
      }

      .boot-logo {
        width: 88px;
        height: 88px;
        filter: drop-shadow(0 18px 32px rgba(79, 70, 229, 0.45));
        animation: boot-pop 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .boot-title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .boot-text {
        font-size: 14px;
        color: #94a3b8;
        max-width: 280px;
        line-height: 1.6;
      }

      .boot-spinner {
        width: 26px;
        height: 26px;
        margin-top: 10px;
        border-radius: 999px;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #818cf8;
        animation: boot-spin 800ms linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-pop {
        from {
          transform: scale(0.85);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img class="boot-logo" src="./logo.svg" alt="" />
        <div class="boot-title">CatatKas</div>
        <p class="boot-text">Catat keuanganmu, kendalikan hidupmu.</p>
        <div class="boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
