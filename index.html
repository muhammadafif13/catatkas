<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="CatatKas — PWA offline-first untuk mencatat pemasukan dan pengeluaran harian. Semua data tersimpan aman di perangkatmu." />
    <meta name="application-name" content="CatatKas" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CatatKas" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>CatatKas — Catatan Keuangan Pribadi</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100dvh;
        min-height: 100svh;
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(99, 102, 241, 0.14), transparent 48%),
          radial-gradient(circle at 50% 28%, rgba(99, 102, 241, 0.2), transparent 42%),
          #0f172a;
        transition:
          opacity 380ms ease,
          visibility 380ms ease;
      }

      .boot-splash--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-splash__glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 340px;
        height: 340px;
        margin: -170px 0 0 -170px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.36) 0%, rgba(99, 102, 241, 0) 68%);
        filter: blur(6px);
        animation: boot-glow 2.6s ease-in-out infinite;
      }

      .boot-splash__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 120px;
        height: 120px;
      }

      .boot-splash__ring {
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0 55%,
          rgba(129, 140, 248, 0.9) 72%,
          rgba(251, 191, 36, 0.95) 86%,
          transparent 100%
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        animation: boot-ring 2s linear infinite;
        opacity: 0.82;
      }

      .boot-logo {
        position: relative;
        z-index: 2;
        width: 88px;
        height: 88px;
        filter: drop-shadow(0 18px 32px rgba(79, 70, 229, 0.45));
        animation: boot-logo-in 680ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .boot-title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.03em;
        animation: boot-text-in 480ms 180ms ease both;
      }

      .boot-text {
        max-width: 280px;
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
        animation: boot-text-in 480ms 300ms ease both;
      }

      .boot-dots {
        display: flex;
        gap: 7px;
        margin-top: 4px;
      }

      .boot-dots span {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #818cf8;
        animation: boot-dot 1s ease-in-out infinite;
      }

      .boot-dots span:nth-child(2) {
        animation-delay: 140ms;
      }

      .boot-dots span:nth-child(3) {
        animation-delay: 280ms;
      }

      .boot-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes boot-logo-in {
        from {
          opacity: 0;
          transform: scale(0.72) rotate(-8deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes boot-glow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }

      @keyframes boot-ring {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-text-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes boot-dot {
        0%,
        80%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash__glow,
        .boot-splash__ring {
          animation: none;
        }

        .boot-logo,
        .boot-title,
        .boot-text,
        .boot-dots span {
          animation-duration: 0.01ms;
          animation-iteration-count: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" class="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash__glow" aria-hidden="true"></div>
      <div class="boot-splash__mark">
        <span class="boot-splash__ring" aria-hidden="true"></span>
        <img class="boot-logo" src="./favicon.svg" alt="" />
      </div>
      <div class="boot-title">CatatKas</div>
      <p class="boot-text">Catat keuanganmu, kendalikan hidupmu.</p>
      <div class="boot-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span class="boot-sr-only">Memuat CatatKas…</span>
    </div>
    <script>
      window.__catatkasBootStartedAt = performance.now();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
